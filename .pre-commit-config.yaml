repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        exclude: "\\.clang-format$"
    -   id: check-toml
    -   id: check-added-large-files
-   repo: https://gitlab.cern.ch/lhcb-core/dev-tools/check-include-convention.git
    rev: decbfbfa7e7cfe1feecbd75bcec7ecc90cab13e8  # frozen: 0.1.0
    hooks:
    -   id: check-include-convention
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 0c9f6988b324eb7fc7dcf171bfce13faa9b13ad3  # frozen: v16.0.6
    hooks:
    -   id: clang-format
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: f8a3f8c471fb698229face5ed7640a64900b781e  # frozen: v0.4.4
    hooks:
    # Run the linter.
    -   id: ruff
        args: [ --fix ]
        exclude: "^.*/options/.*$"
    # Run the formatter.
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: copyright-year
        name: update copyright year
        language: script
        entry: utils/update_copyright_year.py
        types_or: [c++, c, python, cmake, xml, yaml]
        exclude: |
            (?x)(
                ci-utils/preset-.*\.cmake|
                lhcbproject\.yml|
                tests/.*\.yaml|
                \.clang-format
            )
